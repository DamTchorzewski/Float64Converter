name: .NET CI

on:
  push:
    branches: [ main, codex/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore "Float64Converter.csproj"
          dotnet restore "Float64Converter.Tests/Float64Converter.Tests.csproj"

      - name: Build
        run: |
          dotnet build "Float64Converter.csproj" --configuration Release --no-restore
          dotnet build "Float64Converter.Tests/Float64Converter.Tests.csproj" --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test "Float64Converter.Tests/Float64Converter.Tests.csproj" --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx